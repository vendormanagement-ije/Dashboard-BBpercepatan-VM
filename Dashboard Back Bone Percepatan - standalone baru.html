document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

16); border:1px solid rgba(255,255,255,.3); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; font-weight:700; cursor:pointer; flex:none\" style-hover=\"background:#fff; color:#0f766e\">✕<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"bb-modal-body\" style=\"padding:20px 30px 28px; display:flex; flex-direction:column; gap:8px; max-height:70vh; overflow:auto\">\n          <div class=\"bb-aktual-row\" style=\"display:grid; grid-template-columns:1.1fr 1.3fr 1.3fr 100px 100px; gap:12px; padding:0 14px 8px; border-bottom:1.5px solid #eef2f7; font-size:10.5px; font-weight:800; color:#94a1b3; text-transform:uppercase; letter-spacing:.05em\">\n            <div>Mitra Lokal<\u002Fdiv><div>Segment<\u002Fdiv><div>Stasiun<\u002Fdiv><div style=\"text-align:right\">HP Aktual<\u002Fdiv><div style=\"text-align:right\">Total HC<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ patchList }}\" as=\"r\" hint-placeholder-count=\"8\">\n            <div class=\"bb-aktual-row\" style=\"display:grid; grid-template-columns:1.1fr 1.3fr 1.3fr 100px 100px; gap:12px; padding:10px 14px; border-radius:10px; background:{{ r.rowBg }}; align-items:center\">\n              <div style=\"font-size:12.5px; font-weight:700; overflow-wrap:break-word\">{{ r.mitra }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; font-weight:600; color:#4b5b70; overflow-wrap:break-word\">{{ r.segment }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; font-weight:700; overflow-wrap:break-word\">{{ r.stasiun }}<\u002Fdiv>\n              <div style=\"font-size:13px; font-weight:800; color:#0d9488; text-align:right\">{{ r.aktualLabel }}<\u002Fdiv>\n              <div style=\"font-size:13px; font-weight:800; color:#dc2626; text-align:right\">{{ r.hcLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"padding:0 30px 26px; display:flex; flex-wrap:wrap; gap:10px; align-items:center\">\n          <div sc-camel-on-click=\"{{ onClosePatchList }}\" style=\"background:#f1f5f9; color:#334155; padding:12px 22px; border-radius:999px; font-size:13px; font-weight:800; cursor:pointer\" style-hover=\"background:#e2e8f0\">Tutup<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;csvUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Data&quot;},&quot;segmentLimit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:12,&quot;min&quot;:5,&quot;max&quot;:40,&quot;step&quot;:1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Tampilan&quot;},&quot;showOltPanel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Tampilan&quot;}}\">\nconst CSV_DEFAULT = \"https://docs.google.com/spreadsheets/d/e/2PACX-1vQmfpM5Hbi21BOKEeg5_WmpZ8-j9O4UbbyNOjsAJpIo_8BcXxPp3I99fFStNO-syyTHMOWm5J45Y1NW/pub?gid=1915570829&single=true&output=csv\";\n\n// HC (Homeconnect) lookup dari data pelanggan riil, dicocokkan per Mitra Lokal + Stasiun.\n// FMK = Famika, KOP = Kopindosat. Sumber: Pelanggan ODP FMK_v.01.xlsx / Pelanggan ODP KOP_v.01.xlsx\nconst HC_LOOKUP_FMK = {\"DUTA ANUGRAH DAMAI SEJAHTERA|TASIKMALAYA\":2,\"HANDAYANI FIBER MEDIA|CITAYAM\":1,\"FAJAR MITRA KRIDA ABADI|CILACAP\":872,\"FAJAR MITRA KRIDA ABADI|SIDAREJA\":854,\"FAJAR MITRA KRIDA ABADI|KROYA\":1130,\"DEXRADO SINERGI SELARAS|PURWAKARTA\":74,\"FAJAR MITRA KRIDA ABADI|RAJAPOLAH\":330,\"DAPOER POESAT NOESANTARA GROUP|TAMAN KOTA\":147,\"SEMPUR JAYA|RAJAPOLAH\":21,\"RAJASTAR MEDIA NUSANTARA|TASIKMALAYA\":145,\"DELAPAN UNSUR INTI TAMA|JAYAKARTA\":1,\"ARIOSY SADIA RESWARA|KEMIRI\":9,\"KRESA UTAMA MANDIRI|BEKASI\":162,\"SALWA CITRA MANDIRI|SOLO JEBRES\":50,\"TRI AKSES NUSANTARA|SRAGEN\":16,\"SALWA CITRA MANDIRI|MALANG KOTA LAMA\":1,\"DAPOER POESAT NOESANTARA GROUP|PORIS\":9,\"BINA TARUNA MANDIRI|RANGKASBITUNG\":8,\"IDKO ECO JAYA ENERGI|BALAPULANG\":5,\"DAPOER POESAT NOESANTARA GROUP|TIGARAKSA\":15,\"DAPOER POESAT NOESANTARA GROUP|CIKOYA\":1,\"FAJAR MITRA KRIDA ABADI|DELANGGU\":162,\"ANUGERAH SELARAS INDONESIA|PREMBUN\":20,\"SALWA CITRA MANDIRI|BANGIL\":3,\"TRI AKSES NUSANTARA|KEDUNGBANTENG\":33,\"SYAMINDO TEKNIK MANDIRI|CIPEUNDEUY\":4,\"GOLDEN NETWORK NUSANTARA|WONOGIRI\":30,\"RAJASTAR MEDIA NUSANTARA|CIAWI\":12,\"MAWAH MITRA MANDIRI|KEDUNGGALAR\":13,\"ANUGERAH SELARAS INDONESIA|SOKA\":3,\"ARIOSY SADIA RESWARA|KARANGSONO\":219,\"RT RW|CIBATU\":95,\"BERKAH TEKNIK MITRA ABADI|PATUGURAN\":1,\"TRI AKSES NUSANTARA|KEBONROMO\":14,\"ARIOSY SADIA RESWARA|KROYA\":7,\"MAWAH MITRA MANDIRI|WALIKUKUN\":3,\"RT RW|KARANGSARI\":6,\"METRO DUTA SELARAS|PARUNG PANJANG\":8,\"MITRA WANWAN DIDIK|WANARAJA\":2,\"AZZAHRA RAJAWALI MAKMUR|PURWOKERTO\":59,\"MITRA WANWAN DIDIK|BUMIWALUYA\":16,\"JAYAHANA MUNAURA MEKANIKA SELARAS|PADALARANG\":1,\"ARIOSY SADIA RESWARA|GUBUG\":1,\"ARIOSY SADIA RESWARA|MAOS\":1};\nconst HC_LOOKUP_KOP = {\"MATERIAL SUPPLY INDONESIA|SEMARANG TAWANG\":7,\"RAJASTAR MEDIA NUSANTARA|TASIKMALAYA\":870,\"DESNARUM JAYA AKASHA|SEMARANG TAWANG\":384,\"RENALDI|MANGKANG\":403,\"TRANS ARTHA TEKNOLOGI NUSANTARA|PURWOKERTO\":1,\"DAPOER POESAT NOESANTARA GROUP|PURWOKERTO\":2,\"JAYAHANA MUNAURA MEKANIKA SELARAS|CILEDUG\":3,\"LENTERA ABADI SOLUSINET|BENTENG\":1,\"RENALDI|JERAKAH\":88,\"ARIOSY SADIA RESWARA|JAMBON\":761,\"TUJUH SINAR ABADI|LEGOK\":116,\"ARIOSY SADIA RESWARA|CEPER\":1,\"IDKO ECO JAYA ENERGI|SRAGI\":6,\"AZZAHRA RAJAWALI MAKMUR|PURWOKERTO\":13,\"AZZAHRA RAJAWALI MAKMUR|KARANG GANDUL\":5,\"IDKO ECO JAYA ENERGI|SLAWI\":93,\"IDKO ECO JAYA ENERGI|BALAPULANG\":34,\"JALATIKA AGUNG PERKASA|GANDRUNGMANGUN\":3,\"TUJUH SINAR ABADI|KARANGSARI JAWA TENGAH\":7,\"CHARA ABADI SEJAHTERA|BABAKAN\":4,\"ARIOSY SADIA RESWARA|NGROMBO\":2,\"JALATIKA AGUNG PERKASA|KARANGPUCUNG\":11,\"MITRA JAVA TECHNOLOGY|BOJONEGORO\":4};\nconst normHcKey = s => String(s || \"\").toUpperCase().trim().replace(/^(PT|CV|UD)\\.?\\s+/, \"\").replace(/[^A-Z0-9]+/g, \" \").trim().replace(/\\s+/g, \" \");\nfunction lookupHc(mitraUtama, mitra, stasiun, fallback) {\n  const table = /famika/i.test(mitraUtama) ? HC_LOOKUP_FMK : (/kopindosat/i.test(mitraUtama) ? HC_LOOKUP_KOP : null);\n  if (!table) return fallback;\n  const key = normHcKey(mitra) + \"|\" + normHcKey(stasiun);\n  return table[key] !== undefined ? table[key] : fallback;\n}\n\nconst STAGES = [\n  { key: \"HC Progress\", color: \"#12943f\" },\n  { key: \"DRM Perluasan Progress\", color: \"#0d9488\" },\n  { key: \"On Progress\", color: \"#1f5fe0\" },\n  { key: \"NY Start\", color: \"#7c8fa8\" },\n  { key: \"Waiting Material PC\", color: \"#f59e0b\" },\n  { key: \"Waiting Infra Ready (OLT, RBS,)\", color: \"#ea580c\" },\n  { key: \"Cancel\", color: \"#dc2626\" },\n  { key: \"Tanpa Status\", color: \"#cbd5e1\" }\n];\n\nconst BLOCKERS = [\n  { name: \"Patchcore belum datang / salah PC\", color: \"#f59e0b\", test: /patchore|patchcore|wrong pc|pc belum|material pc|waiting material/i },\n  { name: \"Need OLT / OLT penuh\", color: \"#ea580c\", test: /need olt|olt full|olt kurang|olt habis|olt untuk|penambahan olt/i },\n  { name: \"ODC-ODP belum dipetik dari JC\", color: \"#7c3aed\", test: /belum di petik|blm di join|belum di join|blm di lable|belum di lable/i },\n  { name: \"ODC-ODP belum terpasang (Cancel)\", color: \"#dc2626\", test: /not installed odc|no deploy odc|not yet atp odc|tidak ada odc/i },\n  { name: \"Splitter hilang\", color: \"#be185d\", test: /splitter hilang|install spliter|install splitter/i },\n  { name: \"Mitra belum pelurusan / take out\", color: \"#0891b2\", test: /pelurusan|perlurusan|take ?out|takeout|mitra pengganti|plan to/i },\n  { name: \"Core / datek bermasalah\", color: \"#4f46e5\", test: /core belum tersambung|core silang|tidak tembus|redaman|revisi datek|mancore|tracing core|belum ketemu odc/i },\n  { name: \"Akses / infra lapangan\", color: \"#0f766e\", test: /kendala akses|pole|acc lepas|ngondoy|rbs|shelter|repair infra/i }\n];\n\nfunction parseCSV(text) {\n  const rows = [];\n  let row = [], cell = \"\", q = false;\n  for (let i = 0; i < text.length; i++) {\n    const c = text[i];\n    if (q) {\n      if (c === '\"') { if (text[i + 1] === '\"') { cell += '\"'; i++; } else q = false; }\n      else cell += c;\n    } else if (c === '\"') q = true;\n    else if (c === ',') { row.push(cell); cell = \"\"; }\n    else if (c === '\\n') { row.push(cell); rows.push(row); row = []; cell = \"\"; }\n    else if (c !== '\\r') cell += c;\n  }\n  if (cell.length || row.length) { row.push(cell); rows.push(row); }\n  return rows;\n}\n\nconst num = v => { const n = parseInt(String(v == null ? \"\" : v).replace(/[^\\d-]/g, \"\"), 10); return isNaN(n) ? 0 : n; };\nconst fmt = n => new Intl.NumberFormat(\"id-ID\").format(Math.round(n || 0));\nconst clean = v => String(v == null ? \"\" : v).trim().replace(/\\s+/g, \" \");\nconst titleize = s => s.replace(/\\w\\S*/g, w => w[0].toUpperCase() + w.slice(1).toLowerCase());\n\nclass Component extends DCLogic {\n  state = {\n    raw: [], status: \"loading\", err: \"\", updated: null,\n    query: \"\", fRegional: \"ALL\", fSegment: \"ALL\", fStage: \"ALL\", fBlocker: \"ALL\", fMitra: \"ALL\",\n    limit: 120, syncing: false, mitraOpen: null, segmentOpen: null, blockerOpen: null, showAktualList: false, showPatchList: false,\n    mitraCardQuery: \"\", mitraCardRegion: \"ALL\", mitraCardExpanded: false, mitraCardOnlyPatch: false, mitraCardRowExpanded: {},\n    showSegmentListModal: false, segListQuery: \"\", segListMitraUtama: \"ALL\",\n    funnelFamikaExpanded: false, funnelKopindosatExpanded: false, expandedSegGroups: {}, mitraSegExpanded: {}, blockerMitraExpanded: {}, fReplaceRegional: \"ALL\", replaceExpanded: {}, replaceShowMore: false, unmatchedExpanded: false\n  };\n\n  componentDidMount() { this.load(); }\n\n  load() {\n    const url = this.props.csvUrl || CSV_DEFAULT;\n    this.setState({ syncing: true });\n    fetch(url + \"&_cb=\" + Date.now())\n      .then(r => { if (!r.ok) throw new Error(\"HTTP \" + r.status); return r.text(); })\n      .then(t => {\n        const grid = parseCSV(t);\n        let hi = grid.findIndex(r => r.some(c => /mitra pembangunan/i.test(c || \"\")));\n        if (hi < 0) hi = 2;\n        const head = grid[hi].map(clean);\n        const idx = {};\n        head.forEach((h, i) => { if (h && idx[h] === undefined) idx[h] = i; });\n        const g = (r, name) => (idx[name] === undefined ? \"\" : clean(r[idx[name]]));\n        const raw = grid.slice(hi + 1)\n          .filter(r => clean(r[0]) || clean(r[1]) || clean(r[3]))\n          .map(r => {\n            const issue = Array.from(new Set([g(r, \"Issue infra\"), g(r, \"remark\"), g(r, \"Issue tidak bisa HC\")].map(s => clean(s)).filter(Boolean))).join(\" · \");\n            const stageRaw = g(r, \"Progress\");\n            const stage = STAGES.some(s => s.key === stageRaw) ? stageRaw : (stageRaw || \"Tanpa Status\");\n            let blocker = \"\";\n            for (const b of BLOCKERS) if (b.test.test(issue)) { blocker = b.name; break; }\n            return {\n              mitraUtama: g(r, \"Mitra Pembangunan\"),\n              regional: g(r, \"Regional\").toUpperCase(),\n              segment: g(r, \"Segment\"),\n              stasiun: g(r, \"Stasiun\"),\n              corsite: g(r, \"Corsite\"),\n              drafter: titleize(g(r, \"DRAFTER\")),\n              mitra: g(r, \"mitra lokal\"),\n              pic: g(r, \"Nama\"),\n              telp: g(r, \"No telp\"),\n              plan: num(g(r, \"HP Plan\")),\n              plan48: num(g(r, \"Plan 48 Core\")),\n              plan96: num(g(r, \"Plan 96 Core\")),\n              aktual: num(g(r, \"HP Aktual\")),\n              akt48: num(g(r, \"Actual 48 Core\")),\n              akt96: num(g(r, \"Actual 96 Core\")),\n              patching: g(r, \"Patching\") || \"—\",\n              rfsFlag: /true/i.test(g(r, \"RFS\")),\n              odcReady: /true/i.test(g(r, \"ODC - ODP Ready\")),\n              otb: num(g(r, \"Jumlah OTB\")),\n              rfsHp: num(g(r, \"RFS\\n(Jumlah HP)\")) || num(g(r, \"RFS (Jumlah HP)\")),\n              hc: lookupHc(g(r, \"Mitra Pembangunan\"), g(r, \"mitra lokal\"), g(r, \"Stasiun\"), num(g(r, \"HC\"))),\n              stage: stage,\n              oltBrand: g(r, \"OLT Brand Yang dipatching\"),\n              oltCount: num(g(r, \"Jumlah OLT Yang digunakan\")),\n              ports: num(g(r, \"Jumlah port yang di patching\")),\n              datek: (g(r, \"Datek Open Port\\n(Link Excel)\") || g(r, \"Datek Open Port (Link Excel)\") || \"\").replace(/\\s+/g, \"\"),\n              issue: issue,\n              blocker: blocker\n            };\n          });\n        this.setState({ raw: raw, status: raw.length ? \"ok\" : \"empty\", updated: new Date(), syncing: false });\n      })\n      .catch(e => this.setState({ status: \"error\", err: String(e.message || e), syncing: false }));\n  }\n\n  filtered() {\n    const s = this.state;\n    const q = s.query.trim().toLowerCase();\n    return s.raw.filter(r =>\n      (s.fRegional === \"ALL\" || r.regional === s.fRegional) &&\n      (s.fSegment === \"ALL\" || r.segment === s.fSegment) &&\n      (s.fMitra === \"ALL\" || titleize(r.mitra || \"\") === s.fMitra) &&\n      (s.fStage === \"ALL\" || r.stage === s.fStage) &&\n      (s.fBlocker === \"ALL\" || r.blocker === s.fBlocker) &&\n      (!q || (r.stasiun + \" \" + r.segment + \" \" + r.mitra + \" \" + r.regional + \" \" + r.issue + \" \" + r.pic).toLowerCase().includes(q))\n    );\n  }\n\n  renderVals() {\n    const st = this.state;\n    const all = st.raw;\n    const rows = this.filtered();\n    const sum = (a, k) => a.reduce((t, r) => t + r[k], 0);\n\n    const plan = sum(all, \"plan\"), aktual = sum(all, \"aktual\");\n    const rfsHp = sum(all, \"rfsHp\"), hc = sum(all, \"hc\");\n    const odcHp = sum(all.filter(r => r.odcReady), \"aktual\");\n    const patchHp = sum(all.filter(r => /^(done|partial done)$/i.test(r.patching)), \"aktual\");\n\n    const pct = (a, b) => (b > 0 ? (a / b) * 100 : 0);\n    const pctS = (a, b) => (b > 0 ? Math.round(pct(a, b)) + \" %\" : \"—\");\n\n    const rA = pct(aktual, plan), rB = pct(rfsHp, aktual);\n    const ratioA = {\n      pctLabel: pctS(aktual, plan), aLabel: fmt(aktual), bLabel: fmt(plan),\n      deltaLabel: (aktual - plan >= 0 ? \"+\" : \"\") + fmt(aktual - plan),\n      barA: Math.min(100, rA) + \"%\", barB: Math.max(0, Math.min(100, 100 - rA)) + \"%\"\n    };\n    const ratioB = {\n      pctLabel: pctS(rfsHp, aktual), aLabel: fmt(rfsHp), bLabel: fmt(aktual), hcLabel: fmt(hc),\n      barA: Math.min(100, rB) + \"%\", barB: Math.max(0, Math.min(100, 100 - rB)) + \"%\"\n    };\n\n    const uniq = k => Array.from(new Set(all.map(r => r[k]).filter(Boolean)));\n    const regionalList = uniq(\"regional\").sort();\n    const segmentList = uniq(\"segment\").sort();\n    const mitraList = uniq(\"mitra\");\n\n    const noop = () => {};\n    const aktualRows = all.filter(r => r.aktual > 0).sort((a, b) => b.aktual - a.aktual);\n    const aktualList = aktualRows.slice(0, 200).map((r, i) => ({\n      mitra: r.mitra ? titleize(r.mitra) : \"—\", segment: r.segment || \"—\", stasiun: r.stasiun || \"—\",\n      aktualLabel: fmt(r.aktual), hcLabel: fmt(r.hc), rowBg: i % 2 === 0 ? \"#fff\" : \"#f8fafd\"\n    }));\n    const aktualListSummary = fmt(aktualRows.length) + \" stasiun · \" + fmt(sum(aktualRows, \"aktual\")) + \" HP aktual\";\n\n    const patchRows = all.filter(r => /^(done|partial done)$/i.test(r.patching)).sort((a, b) => b.aktual - a.aktual);\n    const patchList = patchRows.slice(0, 200).map((r, i) => ({\n      mitra: r.mitra ? titleize(r.mitra) : \"—\", segment: r.segment || \"—\", stasiun: r.stasiun || \"—\",\n      aktualLabel: fmt(r.aktual), hcLabel: fmt(r.hc), rowBg: i % 2 === 0 ? \"#fff\" : \"#f8fafd\"\n    }));\n    const patchListSummary = fmt(patchRows.length) + \" stasiun · \" + fmt(patchHp) + \" HP patching\";\n\n    const kpis = [\n      { label: \"Mitra Lokal\", value: fmt(mitraList.length), note: \"mitra pelaksana aktif\", color: \"#12943f\", onClick: noop },\n      { label: \"Segment / Ruas\", value: fmt(segmentList.length), note: regionalList.length + \" regional\", color: \"#7c3aed\", onClick: () => this.setState({ showSegmentListModal: true }) },\n      { label: \"HP Plan\", value: fmt(plan), note: fmt(sum(all, \"plan48\")) + \" × 48c · \" + fmt(sum(all, \"plan96\")) + \" × 96c\", color: \"#0891b2\", onClick: noop },\n      { label: \"HP Aktual\", value: fmt(aktual), note: pctS(aktual, plan) + \" dari plan\", color: \"#f59e0b\", onClick: () => this.setState({ showAktualList: true }) },\n      { label: \"HP Patching\", value: fmt(patchHp), note: fmt(patchRows.length) + \" stasiun dipatching\", color: \"#0d9488\", onClick: () => this.setState({ showPatchList: true }) },\n      { label: \"Total Homeconnect\", value: fmt(hc), note: pctS(hc, aktual) + \" dari HP Aktual\", color: \"#dc2626\", onClick: noop }\n    ];\n\n    const fstages = [\n      { label: \"HP Plan\", sub: \"rencana awal (48c + 96c)\", v: plan, color: \"#93b4e8\" },\n      { label: \"HP Aktual\", sub: \"infra ODC-ODP terbangun\", v: aktual, color: \"#1f5fe0\" },\n      { label: \"HP di stasiun ODC-ODP Ready\", sub: \"kolom ODC - ODP Ready = TRUE\", v: odcHp, color: \"#0891b2\" },\n      { label: \"HP di stasiun Patching\", sub: \"Patching Done / Partial Done\", v: patchHp, color: \"#0d9488\" },\n      { label: \"HC — Home Connect\", sub: \"pelanggan tersambung\", v: hc, color: \"#f59e0b\" }\n    ];\n\n    const buildFunnel = rows => {\n      const p = sum(rows, \"plan\"), a = sum(rows, \"aktual\");\n      const odc = sum(rows.filter(r => r.odcReady), \"aktual\");\n      const patch = sum(rows.filter(r => /^(done|partial done)$/i.test(r.patching)), \"aktual\");\n      const hcv = sum(rows, \"hc\");\n      const stages = [\n        { label: \"HP Plan\", sub: \"rencana awal (48c + 96c)\", v: p, color: \"#93b4e8\" },\n        { label: \"HP Aktual\", sub: \"infra ODC-ODP terbangun\", v: a, color: \"#1f5fe0\" },\n        { label: \"HP di stasiun ODC-ODP Ready\", sub: \"kolom ODC - ODP Ready = TRUE\", v: odc, color: \"#0891b2\" },\n        { label: \"HP di stasiun Patching\", sub: \"Patching Done / Partial Done\", v: patch, color: \"#0d9488\" },\n        { label: \"HC — Home Connect\", sub: \"pelanggan tersambung\", v: hcv, color: \"#f59e0b\" }\n      ];\n      const fmax2 = Math.max.apply(null, stages.map(f => f.v).concat([1]));\n      return stages.map((f, i) => {\n        const prev = i === 0 ? f.v : stages[i - 1].v;\n        const drop = prev > 0 ? Math.round((1 - f.v / prev) * 100) : 0;\n        const share = f.v / fmax2;\n        const inside = share > 0.2;\n        return {\n          label: f.label, sub: f.sub, color: f.color,\n          valueLabel: fmt(f.v),\n          labelLeft: inside ? \"14px\" : \"calc(\" + Math.max(share * 100, 1.5) + \"% + 12px)\",\n          labelColor: inside ? \"#fff\" : \"#0f172a\",\n          width: Math.max(share * 100, f.v > 0 ? 1.5 : 0.6) + \"%\",\n          pctLabel: pctS(f.v, p).replace(\" %\", \"%\"),\n          dropLabel: i === 0 ? \"baseline\" : (drop > 0 ? \"−\" + drop + \"%\" : \"+\" + Math.abs(drop) + \"%\"),\n          dropColor: i === 0 ? \"#94a1b3\" : (drop >= 70 ? \"#dc2626\" : drop >= 30 ? \"#ea580c\" : \"#12943f\"),\n          dropBg: i === 0 ? \"#f1f5f9\" : (drop >= 70 ? \"#fee2e2\" : drop >= 30 ? \"#ffedd5\" : \"#dcfce7\")\n        };\n      });\n    };\n    const famikaRows = all.filter(r => /famika/i.test(r.mitraUtama));\n    const kopindosatRows = all.filter(r => /kopindosat/i.test(r.mitraUtama));\n    const keySet = rs => new Set(rs.map(r => normHcKey(r.mitra) + \"|\" + normHcKey(r.stasiun)));\n    const famikaKeySet = keySet(famikaRows), kopindosatKeySet = keySet(kopindosatRows);\n    const unmatchedRaw = [];\n    Object.keys(HC_LOOKUP_FMK
